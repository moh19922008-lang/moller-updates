name: Isolated Android 9 environment health
on:
  push:
    branches: [qa/android9-health-20261127]
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - name: Require host virtualization CPU flags
        run: grep -Eq '\b(vmx|svm)\b' /proc/cpuinfo
      - name: Require device node /dev/kvm
        run: test -c /dev/kvm
      - name: Grant hardware virtualization access in disposable runner
        run: sudo chmod a+rw /dev/kvm && test -r /dev/kvm && test -w /dev/kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install API28 system image and emulator
        run: |
          set -eu
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'system-images;android-28;default;x86_64' 'platforms;android-35' 'build-tools;35.0.0' 'emulator' 'platform-tools'
      - name: Check installed emulator acceleration
        run: |
          set -eu
          "$ANDROID_HOME/emulator/emulator" -accel-check | tee "$RUNNER_TEMP/accel.txt"
          grep -qi 'KVM.*usable' "$RUNNER_TEMP/accel.txt"
      - name: Boot API28 with required hardware virtualization
        run: |
          set -eu
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | avdmanager create avd -f -n MollerHealth -k 'system-images;android-28;default;x86_64' -p "$ANDROID_AVD_HOME/MollerHealth.avd"
          test -f "$ANDROID_AVD_HOME/MollerHealth.avd/config.ini"
          printf '\nhw.cpu.ncore=4\nhw.ramSize=2048\nhw.lcd.width=1920\nhw.lcd.height=1080\nhw.lcd.density=240\n' >> "$ANDROID_AVD_HOME/MollerHealth.avd/config.ini"
          "$ANDROID_HOME/emulator/emulator" -avd MollerHealth -accel on -gpu swiftshader_indirect -no-window -no-snapshot -no-boot-anim -no-metrics > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 240 adb wait-for-device || { tail -60 "$RUNNER_TEMP/emulator.log"; exit 1; }
          for i in $(seq 1 75); do [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] && break; sleep 4; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = 28
          adb shell getprop ro.product.cpu.abi
          adb shell dumpsys webviewupdate | head -20
          adb shell wm size
      - name: Build tiny standalone diagnostic APK (not MOLLER, no production keys)
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/health/src/qa/moller/health" "$RUNNER_TEMP/health/classes" "$RUNNER_TEMP/health/dex"
          cd "$RUNNER_TEMP/health"
          cat > AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="qa.moller.health"><uses-sdk android:minSdkVersion="26" android:targetSdkVersion="28"/><uses-permission android:name="android.permission.INTERNET"/><application android:label="Android 9 Health Probe" android:hardwareAccelerated="true"><activity android:name=".ProbeActivity" android:exported="true" android:screenOrientation="landscape"/></application></manifest>
          MANIFEST
          cat > src/qa/moller/health/ProbeActivity.java <<'JAVA'
          package qa.moller.health;
          import android.app.Activity;import android.os.Bundle;import android.os.Handler;import android.os.Looper;import android.util.Log;import android.view.SurfaceHolder;import android.view.SurfaceView;import android.media.MediaPlayer;import android.webkit.WebView;import android.webkit.WebViewClient;import android.webkit.WebResourceRequest;import android.webkit.WebResourceError;import android.widget.LinearLayout;import java.net.*;import java.util.concurrent.*;
          public final class ProbeActivity extends Activity {
            private MediaPlayer player;private boolean rendered;private final Handler h=new Handler(Looper.getMainLooper());
            private static final String MEDIA="https://upload.wikimedia.org/wikipedia/commons/transcoded/0/0a/Ali_Ayman_-_Because_of_Him_%282021%29.webm/Ali_Ayman_-_Because_of_Him_%282021%29.webm.1080p.vp9.webm";
            private static final String[] NAMES={"YouTubeAPI","YouTubeEmbed","OK","Mail","VK","Vimeo","Dailymotion","IA","Commons","OTA"};
            private static final String[] URLS={"https://www.youtube.com/iframe_api","https://www.youtube-nocookie.com/embed/4D4uDDIFt_k","https://ok.ru/","https://my.mail.ru/","https://vk.com/","https://player.vimeo.com/","https://geo.dailymotion.com/player/xhysi.html?video=x84sh87","https://archive.org/","https://commons.wikimedia.org/","https://moh19922008-lang.github.io/moller-updates/releases/masha-trial/latest.json"};
            public void onCreate(Bundle saved){super.onCreate(saved);getWindow().addFlags(128);LinearLayout l=new LinearLayout(this);l.setOrientation(1);SurfaceView s=new SurfaceView(this);l.addView(s,new LinearLayout.LayoutParams(-1,0,3));WebView w=new WebView(this);l.addView(w,new LinearLayout.LayoutParams(-1,0,1));setContentView(l);
              Log.i("MollerHealth","webview_version="+WebView.getCurrentWebViewPackage().versionName+" accel="+w.isHardwareAccelerated());
              ExecutorService ex=Executors.newFixedThreadPool(4);for(int i=0;i<URLS.length;i++){final int k=i;ex.submit(()->{try{HttpURLConnection c=(HttpURLConnection)new URL(URLS[k]).openConnection();c.setConnectTimeout(10000);c.setReadTimeout(10000);int code=c.getResponseCode();Log.i("MollerHealth","NET "+NAMES[k]+"="+code);c.disconnect();}catch(Exception e){Log.e("MollerHealth","NET "+NAMES[k]+"="+e.getClass().getSimpleName());}});}ex.shutdown();
              w.getSettings().setJavaScriptEnabled(true);w.getSettings().setDomStorageEnabled(true);w.setWebViewClient(new WebViewClient(){public void onPageFinished(WebView v,String u){Log.i("MollerHealth","WEBVIEW_PAGE_FINISHED");}public void onReceivedError(WebView v,WebResourceRequest r,WebResourceError e){if(r.isForMainFrame())Log.w("MollerHealth","WEBVIEW_ERROR="+e.getErrorCode());}});w.loadUrl(URLS[1]);
              s.getHolder().addCallback(new SurfaceHolder.Callback(){public void surfaceCreated(SurfaceHolder holder){try{player=new MediaPlayer();player.setDisplay(holder);player.setDataSource(MEDIA);player.setOnErrorListener((p,a,b)->{Log.e("MollerHealth","MEDIA_ERROR="+a+":"+b);return true;});player.setOnInfoListener((p,a,b)->{if(a==MediaPlayer.MEDIA_INFO_VIDEO_RENDERING_START){rendered=true;Log.i("MollerHealth","MEDIA_FIRST_FRAME");}return false;});player.setOnPreparedListener(p->{int audio=0;for(MediaPlayer.TrackInfo t:p.getTrackInfo())if(t.getTrackType()==MediaPlayer.TrackInfo.MEDIA_TRACK_TYPE_AUDIO)audio++;Log.i("MollerHealth","MEDIA_PREPARED="+p.getVideoWidth()+"x"+p.getVideoHeight()+" audio_tracks="+audio);p.start();sample(0);});player.prepareAsync();}catch(Exception e){Log.e("MollerHealth","MEDIA_SETUP="+e.getClass().getSimpleName());}}public void surfaceChanged(SurfaceHolder h,int f,int x,int y){}public void surfaceDestroyed(SurfaceHolder h){if(player!=null){player.release();player=null;}}});
            }
            private void sample(int n){h.postDelayed(()->{try{if(player==null)return;int p=player.getCurrentPosition();Log.i("MollerHealth","MEDIA_PROGRESS="+p+" rendered="+rendered);if(n<24)sample(n+1);}catch(Exception ignored){}},5000);}
          }
          JAVA
          B="$ANDROID_HOME/build-tools/35.0.0"; A="$ANDROID_HOME/platforms/android-35/android.jar"
          javac -source 8 -target 8 -cp "$A" -d classes src/qa/moller/health/ProbeActivity.java
          "$B/d8" --lib "$A" --min-api 26 --output dex $(find classes -name '*.class')
          "$B/aapt2" link -I "$A" --manifest AndroidManifest.xml -o unsigned.apk
          zip -j unsigned.apk dex/classes.dex
          "$B/zipalign" -f 4 unsigned.apk aligned.apk
          keytool -genkeypair -keystore qa.jks -storepass android -keypass android -alias qa -dname CN=StandaloneHealthProbe -keyalg RSA -validity 1
          "$B/apksigner" sign --ks qa.jks --ks-pass pass:android --key-pass pass:android --out health.apk aligned.apk
          adb install health.apk
      - name: Test actual Android HTTPS, WebView and streamed audio/video
        run: |
          set -eu
          adb logcat -c
          adb shell am start -n qa.moller.health/.ProbeActivity
          for i in $(seq 1 45); do adb logcat -d -s MollerHealth:I > "$RUNNER_TEMP/health-result.txt"; grep -q 'MEDIA_PROGRESS=' "$RUNNER_TEMP/health-result.txt" && grep -q 'NET YouTubeAPI=' "$RUNNER_TEMP/health-result.txt" && [ "$(grep -c 'MEDIA_PROGRESS=' "$RUNNER_TEMP/health-result.txt")" -ge 20 ] && break; sleep 5; done
          cat "$RUNNER_TEMP/health-result.txt"
          grep -q 'NET YouTubeAPI=200' "$RUNNER_TEMP/health-result.txt"
          grep -q 'NET YouTubeEmbed=200' "$RUNNER_TEMP/health-result.txt"
          grep -q 'MEDIA_FIRST_FRAME' "$RUNNER_TEMP/health-result.txt"
          grep -Eq 'MEDIA_PREPARED=1920x804 audio_tracks=[1-9]' "$RUNNER_TEMP/health-result.txt"
          grep -Eq 'MEDIA_PROGRESS=(9[0-9]{4}|[1-9][0-9]{5,}) rendered=true' "$RUNNER_TEMP/health-result.txt"
          ! grep -q 'MEDIA_ERROR=' "$RUNNER_TEMP/health-result.txt"
          grep -q 'WEBVIEW_PAGE_FINISHED' "$RUNNER_TEMP/health-result.txt"
          adb shell dumpsys media.codec | head -50 || true
          adb shell dumpsys meminfo qa.moller.health | head -30
      - name: Save health result only (no APK and no production changes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android9-health-evidence
          path: |
            ${{ runner.temp }}/health-result.txt
            ${{ runner.temp }}/emulator.log
          retention-days: 5
